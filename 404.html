<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" sizes="192x192" href="img/Logo_slogan.jpg">
    <title>Page introuvable - Assist' Addict</title>
    <meta name="robots" content="noindex, follow">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: radial-gradient(60rem 40rem at 100% -10%, rgba(217, 70, 239, 0.1), transparent 60%),
                radial-gradient(50rem 35rem at -10% 5%, rgba(124, 58, 237, 0.1), transparent 55%), #faf8ff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        
        .error-container {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 30px;
            border: 1px solid rgba(124, 58, 237, 0.1);
            box-shadow: 0 26px 60px rgba(76, 29, 149, 0.18);
            max-width: 500px;
        }
        
        .error-code {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 45%, #d946ef 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .error-title {
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            font-weight: 800;
            font-size: 1.5rem;
            color: var(--ink, #1a1225);
            margin-bottom: 1.5rem;
        }
        
        .error-text {
            color: #6b6478;
            margin-bottom: 2rem;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #7c3aed 0%, #a855f7 45%, #d946ef 100%);
            border: none;
            color: #fff;
            padding: 0.75rem 2rem;
            border-radius: 999px;
            font-weight: 700;
            font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
            box-shadow: 0 10px 26px rgba(124, 58, 237, 0.32);
        }
        
        .btn-primary:hover {
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 16px 34px rgba(217, 70, 239, 0.4);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page introuvable</h1>
        <p class="error-text">
            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.<br>
            Vérifiez l'URL ou retournez à la page d'accueil.
        </p>
        <a href="/" class="btn btn-primary">Retour à l'accueil</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
