<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" sizes="192x192" href="img/Logo_slogan.jpg">
    <title>Page introuvable - Assist' Addict</title>
    <meta name="robots" content="noindex, follow">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .error-container {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 1.5rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 500px;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: var(--purple, #400157);
            line-height: 1;
            margin-bottom: 1rem;
        }
        
        .error-title {
            font-size: 1.5rem;
            color: var(--dark);
            margin-bottom: 1.5rem;
        }
        
        .error-text {
            color: #6c757d;
            margin-bottom: 2rem;
        }
        
        .btn-primary {
            background: var(--primary, #009688);
            border-color: var(--primary, #009688);
            padding: 0.75rem 2rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }
        
        .btn-primary:hover {
            background: var(--accent, #ff5722);
            border-color: var(--accent, #ff5722);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-code">404</div>
        <h1 class="error-title">Page introuvable</h1>
        <p class="error-text">
            Désolé, la page que vous recherchez n'existe pas ou a été déplacée.<br>
            Vérifiez l'URL ou retournez à la page d'accueil.
        </p>
        <a href="/" class="btn btn-primary">Retour à l'accueil</a>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
